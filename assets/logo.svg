<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Clipboard Board Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f6fa"/>
    </linearGradient>

    <!-- Clip Gradient -->
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Top Grip Accent Gradient -->
    <linearGradient id="tabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Outgoing Upper Arrow Gradient (Cyan) -->
    <linearGradient id="arrowCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Incoming Lower Arrow Gradient (Violet) -->
    <linearGradient id="arrowVioletGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowBg" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.38"/>
    </filter>
    <filter id="shadowBoard" x="-12%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a0f1e" flood-opacity="0.28"/>
    </filter>
    <filter id="shadowClip" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowArrow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 1. Background Squircle Badge -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#shadowBg)"/>
  <rect x="33.5" y="33.5" width="445" height="445" rx="102.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.32"/>

  <!-- 2. Ambient Signal Waves in Background -->
  <circle cx="256" cy="268" r="175" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.1"/>
  <circle cx="256" cy="268" r="130" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.06"/>

  <!-- 3. Clipboard Board -->
  <g filter="url(#shadowBoard)">
    <rect x="116" y="112" width="280" height="312" rx="36" fill="url(#boardGrad)"/>
    <rect x="117" y="113" width="278" height="310" rx="35" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- 4. Top Clip on Board -->
  <g filter="url(#shadowClip)">
    <rect x="184" y="88" width="144" height="50" rx="14" fill="url(#clipGrad)"/>
    <rect x="185" y="89" width="142" height="48" rx="13" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45"/>
    <rect x="216" y="76" width="80" height="24" rx="8" fill="url(#tabGrad)"/>
    <rect x="236" y="107" width="40" height="12" rx="6" fill="#1e293b" fill-opacity="0.7"/>
  </g>

  <!-- 5. Document text placeholder lines -->
  <rect x="158" y="162" width="110" height="10" rx="5" fill="#d2e2f0" fill-opacity="0.8"/>
  <rect x="158" y="370" width="196" height="10" rx="5" fill="#d2e2f0" fill-opacity="0.8"/>
  <rect x="158" y="390" width="136" height="10" rx="5" fill="#d2e2f0" fill-opacity="0.8"/>

  <!-- 6. Outgoing Relay Arrow (Cyan) -->
  <g filter="url(#shadowArrow)">
    <path d="M 177 207 L 280 207 L 280 188 L 344 220 L 280 252 L 280 233 L 177 233 A 13 13 0 0 1 177 207 Z" fill="url(#arrowCyanGrad)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="201" cy="220" r="5" fill="#ffffff"/>
  </g>

  <!-- 7. Incoming Relay Arrow (Violet) -->
  <g filter="url(#shadowArrow)">
    <path d="M 335 317 L 232 317 L 232 336 L 168 304 L 232 272 L 232 291 L 335 291 A 13 13 0 0 1 335 317 Z" fill="url(#arrowVioletGrad)" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="311" cy="304" r="5" fill="#ffffff"/>
  </g>

  <!-- 8. Center Wireless Waves & Beacon -->
  <g>
    <!-- Outer wave arcs -->
    <path d="M 228 246 A 32 32 0 0 1 284 246" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 284 278 A 32 32 0 0 1 228 278" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
    <!-- Inner wave arcs -->
    <path d="M 239 252 A 20 20 0 0 1 273 252" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
    <path d="M 273 272 A 20 20 0 0 1 239 272" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
    <!-- Center Core Glow & Beacon -->
    <circle cx="256" cy="262" r="12" fill="#0284c7" fill-opacity="0.25"/>
    <circle cx="256" cy="262" r="6" fill="#0284c7"/>
    <circle cx="256" cy="262" r="3" fill="#ffffff"/>
  </g>
</svg>