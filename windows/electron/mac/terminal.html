<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipRelay · 终端</title><link rel="stylesheet" href="vendor/terminal/xterm.css"><link rel="stylesheet" href="terminal.css"></head>
<body><header><strong id="host">远程终端</strong><select id="sessions" aria-label="终端会话"></select><select id="shell" aria-label="新会话类型"><option value="powershell">PowerShell</option><option value="cmd">CMD</option></select><button id="new">新建会话</button><button id="refresh">刷新会话</button><button id="resume">继续连接</button><button id="pause">暂停</button><button id="end">结束会话</button><button id="copy">复制所选</button><button id="paste">粘贴</button></header>
<p id="status" role="status" aria-live="polite"></p><p id="notice">关闭窗口后会话继续运行；30 分钟未访问时自动结束。终端以电脑当前登录用户的普通权限运行。</p>
<div id="terminal" aria-label="远程终端画面"></div><footer><span id="input-status"></span><span>Ctrl+Shift+C / V 复制粘贴 · Shift+拖动选择文本</span></footer>
<dialog id="end-dialog"><p>结束当前会话及其中运行的程序？</p><div><button id="end-cancel">返回</button><button id="end-confirm">结束会话</button></div></dialog>
<script src="vendor/terminal/xterm.js"></script><script src="vendor/terminal/addon-fit.js"></script><script type="module" src="terminal-ui.js"></script></body></html>
