name: macOS Host Companion Build
on:
  push:
    branches: ['codex/desktop-client-input-*', 'codex/macos-host-*']
    paths: ['network/hostcompanion/**', 'network/hostfiles/**', 'network/hostclipboard/**', 'network/hostterminal/**', 'network/hostwake/**', 'network/hostprivacy/**', 'network/hostaudio/**', 'network/cmd/cliprelay-host-network/**', 'network/inputfocus/**', 'scripts/build_host_companion.py', 'scripts/test_host_companion.py', 'scripts/test_host_clipboard.py', 'scripts/test_host_terminal*', 'scripts/test_host_wake*', 'scripts/test_macos_privacy_worker.py', 'scripts/test_host_audio_process.py', 'scripts/privacy_fixture/**', 'scripts/WakeMacInterop.java', 'android-app/remote-engine/src/main/java/com/limelight/nvstream/wol/**', 'scripts/TerminalMacInterop.java', 'android-app/remote-engine/src/main/java/com/limelight/terminal/**', 'scripts/test_host_files*', '.github/workflows/host-companion-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  files-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum
      - name: File recovery and case-sensitive filesystem boundaries
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./hostfiles
      - name: Paired privacy broker expiry and owned process lifetime
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./inputfocus -run 'TestManagedPrivacy|TestPrivacy'
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
          cache-dependency-path: network/go.sum
      - name: Host companion channel and ownership tests
        working-directory: network
        run: go test -v -count=1 -timeout=90s ./hostcompanion ./cmd/cliprelay-host-network
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Native file transfer, recovery and filesystem boundaries
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./hostfiles
      - name: Native clipboard exchange and bounded owned worker
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./hostclipboard
      - name: Native terminal guardian and owned shell lifetime
        working-directory: network
        run: go test -race -v -count=1 -timeout=180s ./hostterminal
      - name: Native read-only wake inventory and paired LAN helper regression
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./hostwake ./inputfocus -run "TestWake"
      - name: Native private audio mute lease and paired stream guards
        working-directory: network
        env:
          CLIPRELAY_AUDIO_MUTE_NATIVE_TEST: '1'
        run: |
          go test -race -json -count=1 -timeout=90s ./hostaudio > ../host-audio-tests.jsonl
          go test -race -json -count=1 -timeout=90s ./inputfocus -run TestAudioMute -skip TestAudioMuteRealWorkerStatusAndEOF > ../host-audio-protocol-tests.jsonl
      - name: Host listener, paired privacy and worker lifetime regression
        working-directory: network
        run: go test -race -v -count=1 -timeout=120s ./inputfocus -run 'TestHostListeners|TestProbeOwner|TestEngineAccess|TestLANPairing|TestManagedPrivacy|TestPrivacy'
      - name: Build universal companion
        run: python3 scripts/build_host_companion.py --output .tools/host-companion
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native packaged companion process acceptance
        run: python3 scripts/test_host_companion.py .tools/host-companion/runtime/cliprelay-host-network --report .tools/host-companion/process-report.json
      - name: Packaged terminal session worker and guardian acceptance
        run: python3 scripts/test_host_terminal_process.py .tools/host-companion/runtime/cliprelay-host-network --report .tools/host-companion/terminal-process-report.json
      - name: Packaged private mask worker admission and native recovery
        run: python3 scripts/test_macos_privacy_worker.py --binary .tools/host-companion/runtime/cliprelay-host-network --output .tools/host-companion/privacy-process-report.json
      - name: Packaged audio mute worker lease, EOF and signal recovery
        run: python3 scripts/test_host_audio_process.py --binary .tools/host-companion/runtime/cliprelay-host-network --output .tools/host-companion/audio-process-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipRelay-Host-Audio-Checks-${{ matrix.arch }}
          path: |
            host-audio-tests.jsonl
            host-audio-protocol-tests.jsonl
            .tools/host-companion/audio-process-report.json
          if-no-files-found: warn
      - name: Preserve executable mode
        run: tar -czf .tools/host-companion-macos.tar.gz -C .tools host-companion
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRelay-Host-Companion-${{ matrix.arch }}
          path: .tools/host-companion-macos.tar.gz
          if-no-files-found: error
