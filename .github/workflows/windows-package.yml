name: Windows Complete Package
on:
  push:
    branches: ['codex/windows-package-*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum
      - name: Validate installation and feature protocols
        run: |
          New-Item -ItemType Directory -Path .tools/uu-parity -Force | Out-Null
          foreach ($test in @('windows-package','desktop-viewer-package','desktop-network-package','file-transfer','clipboard-exchange','privacy-screen','session-lock','audio-mute','wake','terminal','paired-targets','legacy-policy','settings-save-scope','paired-relay','host-pairing','remote-lan-pair-ui','authentication-protocol','image-protocol','multi-peer-broadcast')) {
            $testOptions = @()
            if ($test -eq 'multi-peer-broadcast') { $testOptions = @('-Clipboard') }
            powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "windows/tests/$test.ps1" @testOptions
            if ($LASTEXITCODE -ne 0) { throw "Windows test failed: $test" }
          }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { throw 'Electron tests failed' }
          node --test windows/tests/paired-renderer-routing.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Paired clipboard renderer routing tests failed' }
          node --test windows/tests/windows-host-pairing-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Managed Windows host pairing settings failed' }
          node --test windows/tests/stream-viewer.test.cjs windows/tests/network-controller.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop recovery tests failed' }
          node --test windows/tests/desktop-bitrate.test.cjs windows/tests/desktop-bitrate-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop bitrate tests failed' }
          node --test windows/tests/desktop-privacy.test.cjs windows/tests/desktop-privacy-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop privacy tests failed' }
          node --test windows/tests/desktop-audio-mute.test.cjs windows/tests/desktop-audio-mute-ui.test.cjs windows/tests/desktop-session-lock.test.cjs windows/tests/desktop-session-lock-ui.test.cjs windows/tests/desktop-wake-protocol.test.cjs windows/tests/desktop-wake-store.test.cjs windows/tests/desktop-wake.test.cjs windows/tests/desktop-wake-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop audio mute tests failed' }
          node --test windows/tests/desktop-input.test.cjs windows/tests/desktop-input-session.test.cjs windows/tests/stream-viewer-input.test.cjs windows/tests/desktop-input-ui.test.cjs windows/tests/desktop-display.test.cjs windows/tests/desktop-display-ui.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop input and display tests failed' }
          & windows/tests/file-transfer.ps1 -TestWorkerOutput .tools/uu-parity/file-transfer-tests.exe
          $env:CLIPRELAY_TEST_FILE_WORKER = (Resolve-Path .tools/uu-parity/file-transfer-tests.exe).Path
          node --test windows/tests/desktop-files.test.cjs windows/tests/desktop-files-ui.test.cjs windows/tests/desktop-client-window.test.cjs windows/tests/mac-owned-window.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop file transfer tests failed' }
          & windows/tests/desktop-terminal-ci.ps1
          Push-Location network
          try {
            go test -count=1 -timeout=120s ./inputfocus ./cmd/cliprelay-network
            if ($LASTEXITCODE -ne 0) { throw 'Host protocol tests failed' }
          } finally { Pop-Location }
      - name: Build complete package from verified components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & scripts/resolve_windows_components.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'cliprelay-components')
          & scripts/package_windows.ps1 -OutputDirectory dist
          $package = Get-ChildItem dist/ClipRelay-Windows-*.zip | Select-Object -First 1
          python windows/tests/package_archive.py $package.FullName --output (Join-Path $env:RUNNER_TEMP 'cliprelay-install') --report dist/archive-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Archive preflight acceptance failed' }
      - name: Install on disposable runner
        run: |
          if (Get-Service ClipRelayRemote -ErrorAction SilentlyContinue) { throw 'Runner must not have an existing ClipRelay service.' }
          $installer = Join-Path $env:RUNNER_TEMP 'cliprelay-install/ClipRelay-Windows/install.ps1'
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File $installer -NoStartup
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
      - name: Verify independent installed processes and pipe lifetime
        run: |
          & windows/tests/installed-package.ps1 -ReportPath dist/installed-package-report.json
      - name: Verify installed SYSTEM host pairing and remote rejection
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'cliprelay-pairing-fixture.exe'
          go build -o $fixture windows/tests/mac-pairing-fixture/main.go
          if ($LASTEXITCODE -ne 0) { throw 'Pairing identity fixture build failed' }
          $env:CLIPRELAY_PAIRING_TEST_FIXTURE = $fixture
          node windows/tests/installed-host-pairing.cjs dist/installed-host-pairing-report.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed host pairing failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipRelay-Windows-Complete
          path: dist/*
          if-no-files-found: error
          retention-days: 14
