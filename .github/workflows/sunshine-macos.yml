name: Sunshine macOS Host Build

on:
  push:
    branches: ['codex/desktop-client-input-*', 'codex/macos-host-*']
    paths: ['engine/sunshine/**', 'scripts/prepare_sunshine.py', 'scripts/package_sunshine_macos.py', 'scripts/build_sunshine_macos_dependencies.py', 'scripts/test_sunshine_macos_permissions.py', 'scripts/test_sunshine_macos_state.py', 'scripts/test_sunshine_macos_owner.py', 'scripts/test_macos_capture.py', 'scripts/test_macos_capture.mm', 'scripts/test_macos_privacy_filter.py', 'scripts/test_macos_privacy_filter.mm', 'scripts/privacy_fixture/main.go', 'network/hostprivacy/**', 'network/go.mod', 'network/go.sum', '.github/workflows/sunshine-macos.yml']
  pull_request:
    paths: ['engine/sunshine/**', 'scripts/prepare_sunshine.py', 'scripts/package_sunshine_macos.py', 'scripts/build_sunshine_macos_dependencies.py', 'scripts/test_sunshine_macos_permissions.py', 'scripts/test_sunshine_macos_state.py', 'scripts/test_sunshine_macos_owner.py', 'scripts/test_macos_capture.py', 'scripts/test_macos_capture.mm', 'scripts/test_macos_privacy_filter.py', 'scripts/test_macos_privacy_filter.mm', 'scripts/privacy_fixture/main.go', 'network/hostprivacy/**', 'network/go.mod', 'network/go.sum', '.github/workflows/sunshine-macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunshine-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LizardByte/Sunshine
          ref: 63d35f702ee9e362e43263742981836ec0710384
          submodules: recursive
          path: sunshine-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum
      - name: Verify native privacy filter and owned worker identity
        run: python3 scripts/test_macos_privacy_filter.py --source sunshine-source --output privacy-filter-tests.json
      - name: Verify native capture pixels and window exclusion
        run: python3 scripts/test_macos_capture.py --source sunshine-source --output capture-tests.json
      - name: Check the complete platform overlay before compiling dependencies
        run: python3 scripts/prepare_sunshine.py sunshine-source --check --macos-host
      - name: Install build tools
        run: brew install cmake ninja pkgconf
      - uses: actions/cache/restore@v4
        id: native-dependencies
        with:
          path: mac-dependencies/install
          key: macos-host-dependencies-${{ matrix.arch }}-v1-${{ hashFiles('engine/sunshine/macos-dependencies.json', 'scripts/build_sunshine_macos_dependencies.py') }}
      - name: Build pinned runtime dependencies for macOS 14.2
        run: python3 scripts/build_sunshine_macos_dependencies.py mac-dependencies
      - uses: actions/cache/save@v4
        if: steps.native-dependencies.outputs.cache-hit != 'true'
        with:
          path: mac-dependencies/install
          key: ${{ steps.native-dependencies.outputs.cache-primary-key }}
      - name: Apply pinned source and test platform independent controls
        run: |
          set -euo pipefail
          python3 scripts/prepare_sunshine.py sunshine-source --macos-host
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread engine/sunshine/control_test.cpp -o control-test
          ./control-test
          clang++ -std=c++23 -Wall -Wextra -Werror -pthread engine/sunshine/input_test.cpp -o input-test
          ./input-test
          clang++ -std=c++23 -Wall -Wextra -Werror engine/sunshine/permissions_test.cpp -o permissions-test
          ./permissions-test
          clang++ -std=c++23 -Wall -Wextra -Werror engine/sunshine/state_test.cpp -o state-test
          ./state-test
          clang++ -std=c++23 -Wall -Wextra -Werror engine/sunshine/owner_test.cpp -o owner-test
          ./owner-test
          # Fail before configuration if the pinned dependency has no release tag;
          # upstream would otherwise silently select its latest FFmpeg artifact.
          git -C sunshine-source/third-party/build-deps fetch --tags --depth=1
          git -C sunshine-source/third-party/build-deps describe --tags --exact-match
      - name: Build complete engine and input integration tests
        run: |
          set -euo pipefail
          prefix="$PWD/mac-dependencies/install"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
          cmake -S sunshine-source -B sunshine-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=OFF -DBUILD_TESTS=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.2 -DCMAKE_PREFIX_PATH="$prefix" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$prefix/lib" \
            -DSUNSHINE_ENABLE_TRAY=OFF -DBOOST_USE_STATIC=ON -DOPUS_USE_STATIC=ON \
            -DBoost_DIR="$prefix/lib/cmake/Boost-1.89.0" -DICU_ROOT="$prefix" \
            -DOPENSSL_ROOT_DIR="$prefix" -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DOpus_ROOT_DIR="$prefix" \
            -DSUNSHINE_PUBLISHER_NAME=ClipRelay \
            -DSUNSHINE_PUBLISHER_WEBSITE=https://github.com/ffffhx/cliprelay \
            -DSUNSHINE_PUBLISHER_ISSUE_URL=https://github.com/ffffhx/cliprelay/issues
          cmake --build sunshine-build --parallel 3 2>&1 | tee engine-build.log
          # A callback-drain regression must fail within two minutes, rather
          # than occupy the runner until the entire build job expires.
          python3 -c "import subprocess; subprocess.run(['./sunshine-build/tests/test_sunshine', '--gtest_filter=ClipRelayInputTest.*:ClipRelayMacMouseTest.*:ClipRelayMacCaptureTest.*:ClipRelayMacOwnerTest.*', '--gtest_output=xml:input-tests.xml'], check=True, timeout=120)"
          python3 -c "import subprocess; subprocess.run(['./sunshine-build/tests/test_sunshine', '--gtest_filter=PairingSessionRegistryTest.*:ClipRelayManagedPairingTest.*:PairingHttpHandlerTest.ClipRelayManaged*:ConfigHttpTest.ClipRelayManaged*:ConfigHttpTest.ClipRelayPrivacy*'], check=True, timeout=120)"
      - name: Package relocatable engine and verify dependencies
        run: |
          set -euo pipefail
          cmake --install sunshine-build --prefix "$PWD/engine-artifact" --component Runtime
          python3 scripts/package_sunshine_macos.py \
            --source sunshine-source --build sunshine-build --artifact engine-artifact \
            --arch '${{ matrix.arch }}' --test-results input-tests.xml \
            --dependencies mac-dependencies/install --build-log engine-build.log --capture-results capture-tests.json --privacy-results privacy-filter-tests.json
          tar -czf 'sunshine-cliprelay-macos-${{ matrix.arch }}.tar.gz' engine-artifact
          shasum -a 256 'sunshine-cliprelay-macos-${{ matrix.arch }}.tar.gz' > 'sunshine-cliprelay-macos-${{ matrix.arch }}.tar.gz.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: sunshine-cliprelay-control-macos-${{ matrix.arch }}
          path: |
            sunshine-cliprelay-macos-*.tar.gz
            sunshine-cliprelay-macos-*.tar.gz.sha256
            input-tests.xml
            capture-tests.json
            privacy-filter-tests.json
          if-no-files-found: error
          retention-days: 14
