name: Unix Terminal Provider
on:
  push:
    branches: ['codex/desktop-client-input-*', 'codex/macos-host-*']
    paths: ['network/hostterminal/**', '.github/workflows/terminal-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum
      - name: Session ownership and real pseudo-terminal acceptance
        working-directory: network
        run: go test -mod=readonly -race -count=1 -v -timeout=90s ./hostterminal
