name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - "network/**"
      - "scripts/build_network.py"
      - "scripts/network_notices.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - "network/**"
      - "scripts/build_network.py"
      - "scripts/network_notices.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum

      - name: Check embedded network
        working-directory: network
        run: go test ./...

      - name: Build embedded network for all Android ABIs
        run: python3 scripts/build_network.py android

      - name: Verify and build APK
        working-directory: android-app
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipRelay-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
