name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK
        shell: bash
        run: |
          if android sdk list "platforms/android-37.0" --all >/dev/null 2>&1; then
            android sdk install platforms/android-37.0 build-tools/36.0.0
          else
            sdkmanager "platforms;android-37" "build-tools;36.0.0"
          fi

      - name: Verify and build APK
        working-directory: android-app
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipRelay-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
