name: Android Cloud Sync

on:
  workflow_run:
    workflows: [Android Release]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: android-cloud-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'main' }}
          persist-credentials: false
      - name: Test publisher
        run: python3 -m unittest discover -s deploy -p test_upload_android_release.py
      - name: Resolve newest Android release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          tag="$(jq -r '[.[] | select(.draft == false and .prerelease == false) |
            select(.tag_name | test("^android-v[0-9]+\\.[0-9]+\\.[0-9]+$"))] |
            sort_by(.tag_name | ltrimstr("android-v") | split(".") | map(tonumber)) |
            last | .tag_name // empty' "$RUNNER_TEMP/releases.json")"
          test -n "$tag"
          gh release download "$tag" --pattern update.json --dir dist
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 deploy/upload_android_release.py --directory dist --check-only >> "$GITHUB_OUTPUT"
      - name: Download APK
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .versionName dist/update.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --pattern "ClipRelay-${version}.apk" --dir dist
      - name: Upload and verify Tencent Cloud release
        if: steps.release.outputs.needed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.CLIPRELAY_UPDATES_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.CLIPRELAY_UPDATES_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/cliprelay-ssh"
          key="$RUNNER_TEMP/cliprelay-ssh/key"
          hosts="$RUNNER_TEMP/cliprelay-ssh/known_hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          python3 deploy/upload_android_release.py --directory dist --key "$key" --known-hosts "$hosts"
