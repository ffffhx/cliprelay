name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows client and update flow
        run: |
          foreach ($test in @('updates','settings-ui','settings-save-scope','screen-share-picker-ui','screen-share-tray')) {
            powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "windows/tests/$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Windows test failed: $test" }
          }
          node --test windows/tests/screen-share-protocol.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Screen share tests failed' }
      - name: Package and publish versioned Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = Get-Content windows/version.json -Raw | ConvertFrom-Json
          $tag = 'windows-v' + $version.versionName
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag does not match Windows version' }
          $releases = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases' }
          $exists = @(($releases | ConvertFrom-Json) | Where-Object tagName -eq $tag).Count -gt 0
          if ($exists) {
            # Retry cloud sync using the immutable, already published package.
            gh release download $tag --pattern 'ClipRelay-Windows-*.zip' --pattern windows-update.json --dir dist
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download release' }
            $published = Get-Content dist/windows-update.json -Raw | ConvertFrom-Json
            if ($published.versionCode -ne $version.versionCode) { throw 'Version name already exists with a different code' }
          } else {
            & scripts/package_windows.ps1 -OutputDirectory dist
            gh release create $tag "dist/ClipRelay-Windows-$($version.versionName).zip" dist/windows-update.json --target $env:GITHUB_SHA --latest=false --title "ClipRelay Windows $($version.versionName)" --notes-file windows/release-notes.txt
            if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          retention-days: 7

  sync:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test both publication channels
        run: python3 deploy/test_cliprelay_publish.py
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Publish to update service and verify download
        env:
          DEPLOY_KEY: ${{ secrets.CLIPRELAY_UPDATES_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.CLIPRELAY_UPDATES_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -m 700 "$RUNNER_TEMP/cliprelay-ssh"
          key="$RUNNER_TEMP/cliprelay-ssh/key"
          hosts="$RUNNER_TEMP/cliprelay-ssh/known_hosts"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          version="$(jq -r .versionName dist/windows-update.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="ClipRelay-Windows-${version}.zip"
          digest="$(jq -r .sha256 dist/windows-update.json)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          (cd dist && printf '%s  %s\n' "$digest" "$package" | sha256sum -c -)
          tar -C dist -cf - windows-update.json "$package" | ssh \
            -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            cliprelay-updates@124.221.36.36 publish
          curl --fail --silent --show-error --retry 3 \
            "https://124-221-36-36.anyip.dev:8443/cliprelay/windows/update.json?verify=$GITHUB_RUN_ID" \
            -o "$RUNNER_TEMP/windows-update.json"
          jq -e --arg version "$version" --arg digest "$digest" \
            --argjson code "$(jq -r .versionCode dist/windows-update.json)" \
            '.versionName == $version and .versionCode == $code and .sha256 == $digest' \
            "$RUNNER_TEMP/windows-update.json"
          curl --fail --silent --show-error --retry 3 \
            "https://124-221-36-36.anyip.dev:8443/cliprelay/windows/$package" -o "$RUNNER_TEMP/windows.zip"
          printf '%s  %s\n' "$digest" "$RUNNER_TEMP/windows.zip" | sha256sum -c -
