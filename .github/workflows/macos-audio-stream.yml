name: macOS Audio Stream Development
on:
  push:
    branches: ['codex/desktop-client-input-*']
    paths: ['.github/workflows/macos-audio-stream.yml']
  workflow_dispatch:
    inputs:
      engine_run_id:
        description: 'Successful native engine build'
        type: string
        default: '38994396737'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: network/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Build current companion and disposable identity generator
        run: |
          python3 scripts/build_host_companion.py --output .tools/audio-companion
          go build -o "$RUNNER_TEMP/cliprelay-pairing-fixture" windows/tests/mac-pairing-fixture/main.go
          echo "CLIPRELAY_PAIRING_TEST_FIXTURE=$RUNNER_TEMP/cliprelay-pairing-fixture" >> "$GITHUB_ENV"
      - name: Select immutable native engine
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN: ${{ inputs.engine_run_id || '38994396737' }}
        run: python3 scripts/fetch_sunshine_macos.py --run "$ENGINE_RUN" --arch '${{ matrix.arch }}' --directory .tools/audio-engine
      - name: Stage verified components
        run: python3 scripts/stage_host_audio.py
      - name: Build owned tone and pinned encrypted receiver
        run: python3 scripts/build_macos_audio_fixture.py
      - name: Verify actual audio capture, encrypted Opus and changing tones
        run: node scripts/test_macos_host_audio.cjs .tools/audio-stream-mac audio-stream-development.json
      - name: Build private process output observer
        run: python3 scripts/build_macos_audio_observer.py
      - name: Verify output observer isolates one owned process
        run: node scripts/test_macos_audio_observer.cjs audio-observer-development.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ClipRelay-Audio-Stream-Development-${{ matrix.arch }}
          path: |
            audio-stream-development.json
            audio-observer-development.json
            .tools/audio-stream-components.json
          if-no-files-found: error
