name: Electron macOS build

on:
  workflow_dispatch:
    inputs:
      desktop_client_run_id:
        description: 'Successful Desktop Client Build run to embed (empty: clipboard-only package)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm run setup:electron
      - run: npm run test:electron
      - name: Fetch verified desktop viewer
        if: inputs.desktop_client_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VIEWER_RUN_ID: ${{ inputs.desktop_client_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, tarfile
          run = os.environ['VIEWER_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run): raise SystemExit('Invalid viewer run ID')
          metadata = json.loads(subprocess.check_output(['gh','run','view',run,'--json','conclusion,name,headSha']))
          if metadata['conclusion'] != 'success' or metadata['name'] != 'Desktop Client Build':
              raise SystemExit('Viewer build has not completed successfully')
          directory = pathlib.Path('.tools/viewer-download'); directory.mkdir(parents=True)
          subprocess.run(['gh','run','download',run,'-n','ClipRelay-Stream-macOS','-D',str(directory)],check=True)
          with tarfile.open(directory/'ClipRelay-Stream-macOS.tar.gz') as archive:
              archive.extractall(directory,filter='data')
          artifact = (directory/'ClipRelay-Stream-macOS').resolve()
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('CLIPRELAY_VIEWER_ARTIFACT='+str(artifact)+'\n')
          PY
      - run: npm run build:mac -- ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ClipRelay-macOS-${{ matrix.arch }}
          path: .tools/mac-electron/*.zip
          if-no-files-found: error
